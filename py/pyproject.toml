[project]
name = "ledger-tools"
version = "0.1.0"
description = "Workload generation, history checking, benchmarks and plots for LedgerTable"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.4.1",
    "pyarrow==21.0.0",
    "matplotlib==3.10.7",
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledger"]
