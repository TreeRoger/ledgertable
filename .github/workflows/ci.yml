name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: Java + Python tests and chaos (Linux, MinIO)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEDGER_S3_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.8"
          cache: false
      - name: Cache MinIO build
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/minio
          key: minio-${{ runner.os }}-${{ hashFiles('scripts/install-minio.sh') }}
      - name: Build MinIO from source
        # MinIO no longer publishes community images or binaries; build the pinned commit.
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: scripts/install-minio.sh
      - name: Start MinIO
        run: scripts/minio.sh
      - name: Build
        run: make build
      - name: Java tests (local FS and S3)
        run: make test-java
      - name: Python tests (checker, randomized seeds on local FS and S3, SIGKILL chaos)
        run: make test-py
      - name: Chaos run (high fault rate seeds, real-process SIGKILL test, demo)
        run: |
          cd py
          LEDGER_SEEDS=100-111 .venv/bin/python -m pytest -q tests/test_randomized.py tests/test_process_kill.py
          .venv/bin/python -m ledger.demo --work ../work/demo
      - name: Keep failing runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-run
          path: |
            target/surefire-reports
            work
          if-no-files-found: ignore

  docker:
    name: Docker image builds and passes the tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build
      - name: Run make test inside Docker Compose with MinIO
        run: docker compose run --rm ledger make test
